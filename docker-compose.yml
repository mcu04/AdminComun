version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_NAME=Documentacion
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=mario04
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "./wait-for-it.sh db 5432 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000 ||
             sleep infinity"

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mario04
      - POSTGRES_DB=Documentacion
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
    driver: local
